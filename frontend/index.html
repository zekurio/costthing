<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>costthing · was der Server kostet</title>
    <meta name="description" content="Was der Jellyfin-Server kostet – transparent für alle, die ihn mitnutzen." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <script>
      // apply theme before first paint to avoid a light flash
      const t = localStorage.getItem('costthing.theme')
      document.documentElement.dataset.theme =
        t === 'dark' || t === 'light'
          ? t
          : matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
